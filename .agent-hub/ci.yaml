version: 1
on:
  - finalize
  - manual
timeout_minutes: 30
steps:
  - name: backend-tests
    run: "cd backend && python3 -m venv venv && venv/bin/pip install -r requirements.txt && venv/bin/python manage.py test"
  - name: frontend-tests
    run: "cd frontend && npm ci && CI=true npm test -- --watchAll=false --passWithNoTests"
