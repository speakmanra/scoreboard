version: 2
on:
  - finalize
  - manual
  - push
timeout_minutes: 30
jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: backend tests
        run: "cd backend && python3 -m venv venv && venv/bin/pip install -r requirements.txt && venv/bin/python manage.py test"
  frontend-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: frontend tests
        run: "cd frontend && rm -rf node_modules/.cache && npm ci && CI=true npm test -- --watchAll=false --passWithNoTests"
